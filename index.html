<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fafaf8;--sidebar:#fff;--card:#f5f4f0;--card2:#eeecea;
  --border:#e8e5df;--text:#1a1917;--muted:#9a9590;
  --green:#2d6a4f;--green-bg:#f0f7f4;--red:#c0392b;--red-bg:#fdf2f0;
  --blue:#1a4a8a;--blue-bg:#f0f4fb;--r:10px;
}
*{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Geist Mono','Courier New',monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}
 
/* AUTH SCREEN */
#auth-screen{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;align-items:center;justify-content:center}
#auth-screen.show{display:flex}
.auth-box{background:white;border:1.5px solid var(--border);border-radius:16px;padding:36px;width:100%;max-width:380px;box-shadow:0 8px 40px rgba(0,0,0,.08)}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.auth-logo h1{font-family:'Instrument Serif',serif;font-size:22px;font-weight:400}
.auth-tabs{display:flex;gap:0;margin-bottom:24px;background:var(--card);border-radius:8px;padding:3px}
.auth-tab{flex:1;padding:7px;text-align:center;border-radius:6px;cursor:pointer;font-size:11px;color:var(--muted);transition:all .15s;border:none;background:none;font-family:inherit}
.auth-tab.active{background:white;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase}
.auth-field input{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-family:inherit;font-size:13px;color:var(--text);outline:none;transition:border .2s}
.auth-field input:focus{border-color:var(--text)}
.auth-btn{width:100%;background:var(--text);color:white;border:none;border-radius:8px;padding:11px;font-family:inherit;font-size:12px;cursor:pointer;margin-top:4px;transition:all .15s;letter-spacing:.3px}
.auth-btn:hover{background:#333}
.auth-btn:disabled{opacity:.5;cursor:not-allowed}
.auth-err{font-size:11px;color:var(--red);margin-top:8px;display:none}
.auth-err.show{display:block}
.auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:10px;color:var(--muted)}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.auth-github{width:100%;background:white;border:1.5px solid var(--border);border-radius:8px;padding:10px;font-family:inherit;font-size:12px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.auth-github:hover{border-color:var(--text)}
.psycho-bar{background:#fffdf0;border:1px solid #f0e8a0;border-radius:8px;padding:10px 12px;margin-bottom:16px;font-size:11px;color:#6a5a00}
 
/* FREE LIMIT BAR */
#limit-bar{background:#fff8f0;border-bottom:1px solid #f0d8a0;padding:7px 20px;font-size:11px;color:#8a5a00;display:none;align-items:center;justify-content:space-between;flex-shrink:0}
#limit-bar.show{display:flex}
.limit-progress{flex:1;height:4px;background:#f0e0b0;border-radius:4px;margin:0 12px;overflow:hidden}
.limit-fill{height:100%;background:#e07000;border-radius:4px;transition:width .3s}
.upgrade-link{color:#e07000;cursor:pointer;text-decoration:underline;white-space:nowrap}
 
/* TOPBAR */
#topbar{display:none;padding:10px 16px;background:var(--sidebar);border-bottom:1px solid var(--border);align-items:center;justify-content:space-between;flex-shrink:0}
#topbar h1{font-family:'Instrument Serif',serif;font-size:18px;font-weight:400}
#menu-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text);padding:4px}
 
#app{display:flex;flex:1;overflow:hidden}
 
/* SIDEBAR */
#sidebar{width:260px;min-width:260px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .25s ease}
#logo{padding:16px 14px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.logo-left{display:flex;align-items:center;gap:10px}
#logo h1{font-family:'Instrument Serif',serif;font-size:17px;font-weight:400}
#logo span{font-size:9px;color:var(--muted);display:block;letter-spacing:.5px}
#user-btn{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:10px;cursor:pointer;font-family:inherit;color:var(--muted);transition:all .15s}
#user-btn:hover{border-color:var(--text);color:var(--text)}
#search-wrap{padding:10px 12px;border-bottom:1px solid var(--border)}
#search{width:100%;background:var(--card);border:1.5px solid var(--border);color:var(--text);padding:7px 10px;border-radius:var(--r);font-family:inherit;font-size:12px;outline:none;transition:border .2s}
#search:focus{border-color:var(--text)}
#search::placeholder{color:var(--muted)}
#tags{display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px;border-bottom:1px solid var(--border);min-height:38px}
.tag-btn{background:var(--card);border:1.5px solid var(--border);color:var(--muted);padding:2px 9px;border-radius:20px;font-size:10px;cursor:pointer;font-family:inherit;transition:all .15s}
.tag-btn:hover{border-color:var(--text);color:var(--text)}
.tag-btn.active{background:var(--text);color:white;border-color:var(--text)}
#idea-list{flex:1;overflow-y:auto;padding:6px}
#idea-list::-webkit-scrollbar{width:3px}
#idea-list::-webkit-scrollbar-thumb{background:var(--border)}
.idea-item{padding:10px 11px;border-radius:var(--r);cursor:pointer;border:1.5px solid transparent;margin-bottom:3px;transition:all .15s}
.idea-item:hover{background:var(--card);border-color:var(--border)}
.idea-item.active{background:var(--card2);border-color:var(--text)}
.idea-item .ititle{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idea-item .imeta{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.idea-item .itag{font-size:9px;color:var(--muted);background:var(--card);padding:1px 6px;border-radius:10px;border:1px solid var(--border)}
.empty{color:var(--muted);font-size:11px;padding:20px 12px;text-align:center;line-height:1.8}
#sidebar-footer{padding:10px 12px;border-top:1px solid var(--border);font-size:9px;color:var(--muted)}
 
/* MAIN */
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
#main::-webkit-scrollbar{width:3px}
#main::-webkit-scrollbar-thumb{background:var(--border)}
.placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);padding:40px}
.ph-icon{width:48px;height:48px;border:2px dashed var(--border);border-radius:14px;display:grid;place-items:center;font-size:20px;margin-bottom:4px}
.placeholder h2{font-family:'Instrument Serif',serif;font-size:24px;font-weight:400;color:var(--text)}
.placeholder p{font-size:11px;text-align:center;max-width:260px;line-height:1.8}
#detail-wrap{padding:28px 36px;max-width:680px;width:100%;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.new-pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;background:#fff8f0;color:#b05a00;border:1px solid #f0d0a0;padding:3px 12px;border-radius:20px;margin-bottom:14px}
.new-pill::before{content:'';width:5px;height:5px;border-radius:50%;background:#e07000}
.det-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.det-tag{font-size:10px;color:var(--green);background:var(--green-bg);padding:2px 10px;border-radius:12px}
#detail-wrap h2{font-family:'Instrument Serif',serif;font-size:30px;font-weight:400;line-height:1.2;margin-bottom:16px;letter-spacing:-.4px}
.section-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.summary-box{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:14px 16px;font-size:13px;line-height:1.8;color:#4a4845;margin-bottom:22px}
.edit-input{width:100%;background:white;border:1.5px solid var(--border);border-radius:var(--r);padding:10px 12px;font-family:inherit;font-size:13px;color:var(--text);outline:none;resize:vertical;line-height:1.7;transition:border .2s;margin-bottom:22px}
.edit-input:focus{border-color:var(--text)}
.edit-title{font-family:'Instrument Serif',serif;font-size:24px;padding:8px 12px;margin-bottom:14px;border-radius:var(--r);resize:none}
.tasks{list-style:none;display:flex;flex-direction:column;gap:5px;margin-bottom:22px}
.tasks li{display:flex;align-items:flex-start;gap:10px;font-size:12.5px;line-height:1.6;padding:9px 12px;background:var(--card);border-radius:8px;border:1.5px solid var(--border);cursor:pointer;transition:all .15s;user-select:none}
.tasks li.done{text-decoration:line-through;color:var(--muted);background:#f9f9f7}
.task-check{width:16px;height:16px;border:1.5px solid var(--border);border-radius:4px;flex-shrink:0;margin-top:2px;display:grid;place-items:center;font-size:10px;transition:all .15s}
.tasks li.done .task-check{background:var(--green);border-color:var(--green);color:white}
.edit-tasks{display:flex;flex-direction:column;gap:5px;margin-bottom:22px}
.edit-task-row{display:flex;gap:6px;align-items:center}
.edit-task-row input{flex:1;background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:12px;color:var(--text);outline:none}
.edit-task-row input:focus{border-color:var(--text)}
.rm-task{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px;line-height:1}
.rm-task:hover{color:var(--red)}
.add-task-btn{background:var(--card);border:1.5px dashed var(--border);border-radius:8px;padding:7px 12px;font-family:inherit;font-size:11px;color:var(--muted);cursor:pointer;text-align:left;width:100%;transition:all .15s}
.add-task-btn:hover{border-color:var(--text);color:var(--text)}
.btn-row{display:flex;gap:7px;flex-wrap:wrap}
.btn{padding:8px 18px;border-radius:var(--r);font-family:inherit;font-size:11px;cursor:pointer;border:none;transition:all .15s;letter-spacing:.3px}
.btn-save{background:var(--text);color:white;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.btn-save:hover{background:#333;transform:translateY(-1px)}
.btn-edit{background:var(--card);border:1.5px solid var(--border);color:var(--text)}
.btn-edit:hover{border-color:var(--text)}
.btn-improve{background:var(--blue-bg);border:1.5px solid #c0d0f0;color:var(--blue)}
.btn-improve:hover{background:#e0eaff;border-color:var(--blue)}
.btn-export{background:var(--green-bg);border:1.5px solid #a0d0b0;color:var(--green)}
.btn-export:hover{background:#d0f0e0;border-color:var(--green)}
.btn-del{background:transparent;border:1.5px solid var(--border);color:var(--muted)}
.btn-del:hover{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.btn-cancel{background:transparent;border:1.5px solid var(--border);color:var(--muted)}
#ai-section{padding:0 36px 28px;max-width:680px;width:100%}
.ai-divider{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ai-divider::before,.ai-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.ai-divider span{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
#ai-input{width:100%;background:var(--card);border:1.5px solid var(--border);color:var(--text);padding:12px 14px;border-radius:var(--r);font-family:inherit;font-size:12px;outline:none;resize:vertical;min-height:80px;transition:border .2s;line-height:1.6}
#ai-input:focus{border-color:var(--text)}
#ai-input::placeholder{color:var(--muted)}
.ai-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.char-count{font-size:10px;color:var(--muted)}
#ai-gen-btn{padding:9px 20px;background:var(--card);border:1.5px solid var(--border);color:var(--text);border-radius:var(--r);font-family:inherit;font-size:11px;cursor:pointer;transition:all .15s}
#ai-gen-btn:hover{background:var(--text);color:white;border-color:var(--text)}
#ai-gen-btn:disabled{opacity:.4;cursor:not-allowed}
.spin{display:inline-block;width:9px;height:9px;border:1.5px solid #ccc;border-top-color:var(--text);border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.offline-bar{background:#fff3cd;border-bottom:1px solid #ffc107;padding:7px 36px;font-size:11px;color:#856404;display:none;flex-shrink:0}
.offline-bar.show{display:block}
 
/* USER DROPDOWN */
#user-menu{display:none;position:absolute;top:52px;right:14px;background:white;border:1.5px solid var(--border);border-radius:10px;padding:6px;box-shadow:0 4px 20px rgba(0,0,0,.1);z-index:50;min-width:160px}
#user-menu.show{display:block}
.user-email{font-size:10px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--border);margin-bottom:4px}
.menu-item{padding:7px 10px;border-radius:6px;font-size:11px;cursor:pointer;transition:background .15s}
.menu-item:hover{background:var(--card)}
.menu-item.danger{color:var(--red)}
 
@media(max-width:640px){
  #topbar{display:flex}
  #logo{display:none}
  #sidebar{position:fixed;top:0;left:0;height:100%;z-index:100;transform:translateX(-100%);box-shadow:4px 0 20px rgba(0,0,0,.1)}
  #sidebar.open{transform:translateX(0)}
  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99}
  #overlay.show{display:block}
  #detail-wrap,#ai-section{padding:20px 18px}
}
</style>
</head>

<script>
const SUPABASE_URL = 'https://cqdkgttniikfdglbmvaa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fqYld0v11gzO32gFGNLD_Q_hfPB1qE9';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
 
const FREE_LIMIT = 5;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 
let ideas=[], selectedIdea=null, searchQuery='', activeTag=null, pendingIdea=null, editMode=false, isGenerating=false, currentUser=null;
 
// ── AUTH ───────────────────────────────────────────────
const authScreen = document.getElementById('auth-screen');
let authMode = 'login';
 
document.getElementById('tab-login').onclick = () => { authMode='login'; document.getElementById('tab-login').classList.add('active'); document.getElementById('tab-signup').classList.remove('active'); document.getElementById('auth-submit').textContent='Inloggen'; document.getElementById('terms-check').style.display='none'; };
document.getElementById('tab-signup').onclick = () => { authMode='signup'; document.getElementById('tab-signup').classList.add('active'); document.getElementById('tab-login').classList.remove('active'); document.getElementById('auth-submit').textContent='Account aanmaken'; document.getElementById('terms-check').style.display='flex'; };
 
document.getElementById('auth-submit').onclick = async () => {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const btn = document.getElementById('auth-submit');
  const err = document.getElementById('auth-err');
  if(authMode==='signup' && !document.getElementById('agree-cb').checked){
    err.textContent='Je moet akkoord gaan met de voorwaarden.'; err.classList.add('show'); return;
  }
  btn.disabled=true; err.classList.remove('show');
  const {error} = authMode==='login'
    ? await sb.auth.signInWithPassword({email,password})
    : await sb.auth.signUp({email,password});
  if(error){ err.textContent=error.message; err.classList.add('show'); }
  else if(authMode==='signup'){ err.style.color='var(--green)'; err.textContent='Check je email voor bevestiging!'; err.classList.add('show'); }
  btn.disabled=false;
};
 
document.getElementById('auth-github').onclick = async () => {
  await sb.auth.signInWithOAuth({provider:'github', options:{redirectTo: window.location.href}});
};
 
sb.auth.onAuthStateChange(async (event, session) => {
  if(session?.user){
    // Check if user agreed to terms
    const agreedKey = 'ideaos_agreed_'+session.user.id;
    if(!localStorage.getItem(agreedKey)){
      showTermsGate(session.user, agreedKey);
      return;
    }
    currentUser = session.user;
    document.getElementById('user-email-display').textContent = currentUser.email;
    authScreen.classList.remove('show');
    await loadIdeas();
    renderApp();
  } else {
    currentUser = null;
    ideas = [];
    authScreen.classList.add('show');
  }
});
 
// ── USER MENU ──────────────────────────────────────────
document.getElementById('user-btn').onclick = (e) => {
  e.stopPropagation();
  document.getElementById('user-menu').classList.toggle('show');
};
document.addEventListener('click', () => document.getElementById('user-menu').classList.remove('show'));
document.getElementById('logout-btn').onclick = async () => { await sb.auth.signOut(); };
 
// ── DATABASE ───────────────────────────────────────────
async function loadIdeas() {
  const {data} = await sb.from('ideas').select('*').order('created_at',{ascending:false});
  ideas = data || [];
}
 
async function saveIdea(idea) {
  await sb.from('ideas').upsert({...idea, user_id: currentUser.id});
}
 
async function deleteIdea(id) {
  await sb.from('ideas').delete().eq('id',id);
}
 
async function updateTaskDone(id, taskDone) {
  await sb.from('ideas').update({task_done: taskDone}).eq('id',id);
}
 
// ── TERMS GATE ────────────────────────────────────────
function showTermsGate(user, agreedKey) {
  document.getElementById('auth-screen').classList.remove('show');
  let gate = document.getElementById('terms-gate');
  if(!gate){
    gate = document.createElement('div');
    gate.id = 'terms-gate';
    gate.style.cssText = 'position:fixed;inset:0;background:#fafaf8;z-index:150;display:flex;align-items:center;justify-content:center';
    gate.innerHTML = `<div style="background:white;border:1.5px solid #e8e5df;border-radius:16px;padding:36px;max-width:380px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.08)">
      <h2 style="font-family:'Instrument Serif',serif;font-size:22px;font-weight:400;margin-bottom:16px">Welkom bij IdeaOS</h2>
      <p style="font-size:12px;color:#4a4845;margin-bottom:20px;line-height:1.7">Voor je verder gaat moet je akkoord gaan met onze voorwaarden.</p>
      <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:20px;font-size:12px;color:#4a4845">
        <input type="checkbox" id="gate-cb" style="margin-top:2px;flex-shrink:0">
        <label for="gate-cb">Ik ga akkoord met de <a href="https://ideaos-smoky.vercel.app/terms.html" target="_blank" style="color:#1a1917">gebruiksvoorwaarden</a> en het <a href="https://ideaos-smoky.vercel.app/privacy.html" target="_blank" style="color:#1a1917">privacybeleid</a></label>
      </div>
      <div id="gate-err" style="font-size:11px;color:#c0392b;margin-bottom:10px;display:none">Je moet akkoord gaan om verder te gaan.</div>
      <button id="gate-btn" style="width:100%;background:#1a1917;color:white;border:none;border-radius:8px;padding:11px;font-family:inherit;font-size:12px;cursor:pointer">Doorgaan</button>
      <button id="gate-logout" style="width:100%;background:none;border:none;color:#9a9590;font-family:inherit;font-size:11px;cursor:pointer;margin-top:8px">Uitloggen</button>
    </div>`;
    document.body.appendChild(gate);
  }
  gate.style.display = 'flex';
  document.getElementById('gate-btn').onclick = async () => {
    if(!document.getElementById('gate-cb').checked){
      document.getElementById('gate-err').style.display='block'; return;
    }
    localStorage.setItem(agreedKey, '1');
    gate.style.display = 'none';
    currentUser = user;
    document.getElementById('user-email-display').textContent = user.email;
    authScreen.classList.remove('show');
    await loadIdeas();
    renderApp();
  };
  document.getElementById('gate-logout').onclick = async () => {
    await sb.auth.signOut();
    gate.style.display = 'none';
  };
}
 
// ── LIMIT CHECK ────────────────────────────────────────
function updateLimitBar() {
  const bar = document.getElementById('limit-bar');
  const count = ideas.length;
  if(count >= FREE_LIMIT - 1) {
    bar.classList.add('show');
    document.getElementById('limit-text').textContent = `${count}/${FREE_LIMIT} gratis ideeën gebruikt`;
    document.getElementById('limit-fill').style.width = `${(count/FREE_LIMIT)*100}%`;
  } else {
    bar.classList.remove('show');
  }
}
 
// ── HELPERS ────────────────────────────────────────────
const uid = () => Date.now()+'-'+Math.random().toString(36).slice(2,7);
const getFiltered = () => ideas.filter(i=>(!searchQuery||i.title.toLowerCase().includes(searchQuery.toLowerCase()))&&(!activeTag||i.tags.includes(activeTag)));
const getAllTags = () => [...new Set(ideas.flatMap(i=>i.tags||[]))];
 
window.addEventListener('online', renderApp);
window.addEventListener('offline', renderApp);
 
document.getElementById('menu-btn').onclick = () => { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); };
document.getElementById('overlay').onclick = closeSidebar;
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
 
// ── AI ─────────────────────────────────────────────────
async function callMistral(sys, usr) {
  if(!navigator.onLine) throw new Error('Geen internetverbinding');
  const r = await fetch('/api/generate', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({prompt:usr, mode:'generate'})
  });
  const txt = await r.text();
  if(!r.ok) throw new Error(JSON.parse(txt).error||'AI fout');
  return txt.replace(/```json|```/g,'').trim();
}
 
async function generateIdea(prompt) {
  const txt = await callMistral('', prompt);
  try { return JSON.parse(txt); } catch { throw new Error('AI gaf geen geldig antwoord.'); }
}
 
async function improveIdea(idea) {
  if(!navigator.onLine) throw new Error('Geen internetverbinding');
  const r = await fetch('/api/generate', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({mode:'improve', idea})
  });
  const txt = await r.text();
  if(!r.ok) throw new Error(JSON.parse(txt).error||'AI fout');
  try { return JSON.parse(txt.replace(/```json|```/g,'').trim()); } catch { throw new Error('AI gaf geen geldig antwoord.'); }
}
 
function exportMarkdown(idea) {
  const done = idea.task_done||{};
  const md = `# ${idea.title}\n\n**Tags:** ${(idea.tags||[]).map(t=>'#'+t).join(' ')}\n\n## Samenvatting\n${idea.summary}\n\n## Taken\n${(idea.tasks||[]).map((t,i)=>`- [${done[i]?'x':' '}] ${t}`).join('\n')}\n\n---\n*Geëxporteerd vanuit IdeaOS*`;
  const blob = new Blob([md],{type:'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=idea.title.replace(/\s+/g,'-').toLowerCase()+'.md';
  a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
 
// ── RENDER ─────────────────────────────────────────────
function aiPanel(){return`<div id="ai-section"><div class="ai-divider"><span>Genereer nieuw idee</span></div><textarea id="ai-input" placeholder="bijv. een app om gewoontes bij te houden..." maxlength="500"></textarea><div class="ai-bottom"><span class="char-count" id="char-count">0/500</span><button id="ai-gen-btn">Genereer idee →</button></div></div>`;}
 
function renderTasksEdit(tasks){return`<div class="edit-tasks" id="edit-tasks">${(tasks||[]).map((t,i)=>`<div class="edit-task-row"><input type="text" value="${esc(t)}" maxlength="200"><button class="rm-task">×</button></div>`).join('')}<button class="add-task-btn" id="add-task-btn">+ Taak toevoegen</button></div>`;}
 
function renderApp(){
  if(!currentUser) return;
  updateLimitBar();
  const filtered=getFiltered(), tags=getAllTags();
  document.getElementById('tags').innerHTML=tags.map(t=>`<button class="tag-btn${activeTag===t?' active':''}" data-tag="${esc(t)}">#${esc(t)}</button>`).join('');
  document.getElementById('idea-list').innerHTML=filtered.length
    ?filtered.map(i=>`<div class="idea-item${selectedIdea?.id===i.id?' active':''}" data-id="${i.id}"><div class="ititle">${esc(i.title)}</div><div class="imeta">${(i.tags||[]).map(t=>`<span class="itag">#${esc(t)}</span>`).join('')}</div></div>`).join('')
    :`<div class="empty">Nog geen ideeën.<br>Genereer je eerste hieronder.</div>`;
 
  const idea=pendingIdea||selectedIdea;
  const main=document.getElementById('main');
  const offline=`<div class="offline-bar${!navigator.onLine?' show':''}">⚠️ Geen internet — AI werkt niet.</div>`;
 
  if(!idea){
    main.innerHTML=offline+`<div class="placeholder"><div class="ph-icon">◈</div><h2>Jouw idee workspace</h2><p>Genereer een idee hieronder of selecteer er een uit de zijbalk.</p></div>`+aiPanel();
  } else if(editMode&&!pendingIdea){
    main.innerHTML=offline+`<div id="detail-wrap">
      <div class="section-label">Titel</div><input class="edit-input edit-title" id="edit-title" type="text" value="${esc(idea.title)}" maxlength="100">
      <div class="section-label">Samenvatting</div><textarea class="edit-input" id="edit-summary" rows="4" maxlength="1000">${esc(idea.summary)}</textarea>
      <div class="section-label">Taken</div>${renderTasksEdit(idea.tasks)}
      <div class="section-label" style="margin-top:4px">Tags (komma gescheiden)</div><input class="edit-input" id="edit-tags" type="text" value="${esc((idea.tags||[]).join(', '))}" maxlength="200">
      <div class="btn-row"><button class="btn btn-save" id="btn-save-edit">Opslaan</button><button class="btn btn-cancel" id="btn-cancel-edit">Annuleren</button></div>
    </div>`+aiPanel();
  } else {
    const isPending=!!pendingIdea;
    const done=idea.task_done||{};
    main.innerHTML=offline+`<div id="detail-wrap">
      ${isPending?'<div class="new-pill">NIEUW — nog niet opgeslagen</div>':''}
      <div class="det-tags">${(idea.tags||[]).map(t=>`<span class="det-tag">#${esc(t)}</span>`).join('')}</div>
      <h2>${esc(idea.title)}</h2>
      <div class="section-label">Samenvatting</div><div class="summary-box">${esc(idea.summary)}</div>
      <div class="section-label">Taken</div>
      <ul class="tasks">${(idea.tasks||[]).map((t,i)=>`<li class="${done[i]?'done':''}" data-ti="${i}"><div class="task-check">${done[i]?'✓':''}</div>${esc(t)}</li>`).join('')}</ul>
      <div class="btn-row">
        ${isPending
          ?`<button class="btn btn-save" id="btn-save">Opslaan</button>`
          :`<button class="btn btn-edit" id="btn-edit">Bewerken</button>
            <button class="btn btn-improve" id="btn-improve">◈ Verbeter</button>
            <button class="btn btn-export" id="btn-export">↓ Export MD</button>
            <button class="btn btn-del" id="btn-del">Verwijderen</button>`}
      </div>
    </div>`+aiPanel();
  }
  bindEvents();
}
 
function bindEvents(){
  document.getElementById('ai-input')?.addEventListener('input',e=>{ document.getElementById('char-count').textContent=`${e.target.value.length}/500`; });
  document.querySelectorAll('.tag-btn').forEach(b=>b.onclick=()=>{activeTag=activeTag===b.dataset.tag?null:b.dataset.tag;renderApp()});
  document.querySelectorAll('.idea-item').forEach(el=>el.onclick=()=>{ pendingIdea=null;editMode=false;selectedIdea=ideas.find(i=>i.id===el.dataset.id)||null;closeSidebar();renderApp(); });
 
  document.getElementById('btn-save')?.addEventListener('click',async()=>{
    if(ideas.length>=FREE_LIMIT){alert(`Je hebt het gratis limiet van ${FREE_LIMIT} ideeën bereikt. Upgrade naar Pro voor onbeperkt!`);return;}
    const idea={...pendingIdea,id:uid(),user_id:currentUser.id,task_done:{}};
    await saveIdea(idea);ideas.unshift(idea);
    pendingIdea=null;selectedIdea=idea;renderApp();
  });
 
  document.getElementById('btn-del')?.addEventListener('click',async()=>{
    if(!confirm(`"${selectedIdea.title}" verwijderen?`))return;
    await deleteIdea(selectedIdea.id);
    ideas=ideas.filter(i=>i.id!==selectedIdea.id);selectedIdea=null;renderApp();
  });
 
  document.getElementById('btn-edit')?.addEventListener('click',()=>{editMode=true;renderApp()});
  document.getElementById('btn-cancel-edit')?.addEventListener('click',()=>{editMode=false;renderApp()});
 
  document.getElementById('btn-save-edit')?.addEventListener('click',async()=>{
    const tasks=[...document.querySelectorAll('.edit-task-row input')].map(i=>i.value.trim()).filter(Boolean);
    const tags=document.getElementById('edit-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
    const updated={...selectedIdea,title:document.getElementById('edit-title').value.trim().slice(0,100),summary:document.getElementById('edit-summary').value.trim().slice(0,1000),tasks,tags};
    await saveIdea(updated);ideas=ideas.map(i=>i.id===updated.id?updated:i);selectedIdea=updated;editMode=false;renderApp();
  });
 
  document.getElementById('add-task-btn')?.addEventListener('click',()=>{
    const row=document.createElement('div');row.className='edit-task-row';
    row.innerHTML=`<input type="text" placeholder="Nieuwe taak..." maxlength="200"><button class="rm-task">×</button>`;
    row.querySelector('.rm-task').onclick=()=>row.remove();
    document.getElementById('edit-tasks').insertBefore(row,document.getElementById('add-task-btn'));
    row.querySelector('input').focus();
  });
  document.querySelectorAll('.rm-task').forEach(b=>b.onclick=()=>b.closest('.edit-task-row').remove());
 
  document.querySelectorAll('.tasks li').forEach(li=>li.onclick=async()=>{
    if(!selectedIdea)return;
    const ti=li.dataset.ti;
    const done={...selectedIdea.task_done||{}};
    done[ti]=!done[ti];
    selectedIdea={...selectedIdea,task_done:done};
    ideas=ideas.map(i=>i.id===selectedIdea.id?selectedIdea:i);
    await updateTaskDone(selectedIdea.id,done);renderApp();
  });
 
  document.getElementById('btn-improve')?.addEventListener('click',async()=>{
    if(!confirm('Huidige idee overschrijven met verbeterde versie?'))return;
    const btn=document.getElementById('btn-improve');btn.disabled=true;btn.innerHTML='<span class="spin"></span>Verbeteren...';
    try{const improved=await improveIdea(selectedIdea);improved.id=selectedIdea.id;improved.user_id=currentUser.id;improved.task_done=selectedIdea.task_done||{};await saveIdea(improved);ideas=ideas.map(i=>i.id===improved.id?improved:i);selectedIdea=improved;}
    catch(e){alert('Fout: '+e.message);}
    renderApp();
  });
 
  document.getElementById('btn-export')?.addEventListener('click',()=>exportMarkdown(selectedIdea));
 
  document.getElementById('ai-gen-btn')?.addEventListener('click',async()=>{
    if(isGenerating)return;
    if(ideas.length>=FREE_LIMIT){alert(`Gratis limiet bereikt (${FREE_LIMIT} ideeën). Upgrade naar Pro!`);return;}
    const prompt=document.getElementById('ai-input').value.trim();
    if(!prompt)return;
    isGenerating=true;const btn=document.getElementById('ai-gen-btn');
    btn.disabled=true;btn.innerHTML='<span class="spin"></span>Genereren...';
    try{pendingIdea=await generateIdea(prompt);selectedIdea=null;closeSidebar();}
    catch(e){alert('Fout: '+e.message);}
    isGenerating=false;renderApp();
    const inp=document.getElementById('ai-input');
    if(inp&&pendingIdea){inp.value='';document.getElementById('char-count').textContent='0/500';}
  });
 
  document.getElementById('upgrade-link')?.addEventListener('click',()=>alert('Pro plan komt binnenkort! Stuur een email naar pro@ideaos.app om op de wachtlijst te komen.'));
 
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&editMode){editMode=false;renderApp();}
    if(e.key==='Enter'&&e.ctrlKey){document.getElementById('ai-gen-btn')?.click();}
  },{once:true});
}
 
document.getElementById('search').addEventListener('input',e=>{searchQuery=e.target.value;renderApp()});
</script>
